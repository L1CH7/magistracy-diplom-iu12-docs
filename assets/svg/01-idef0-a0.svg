<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#000000"/>
    </marker>
  </defs>

  <rect width="960" height="580" fill="#ffffff"/>

  <!-- Центральный блок А-0 -->
  <rect x="330" y="210" width="300" height="150" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="480" y="265" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#000000">Система формирования и сопровождения</text>
  <text x="480" y="285" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#000000">базы геоданных и топологических</text>
  <text x="480" y="305" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#000000">моделей транспортной сети</text>
  <text x="615" y="350" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="end" fill="#000000">А-0</text>

  <!-- ВХОДЫ (Слева) -->
  <line x1="80" y1="250" x2="330" y2="250" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="200" y="242" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#000000">Сырые геоданные OSM (.osm.pbf)</text>

  <line x1="80" y1="320" x2="330" y2="320" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="200" y="312" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#000000">Параметры области и сценария (YAML)</text>

  <!-- УПРАВЛЕНИЯ (Сверху) -->
  <line x1="390" y1="80" x2="390" y2="210" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="390" y="60" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#000000">Требования ПДД</text>
  <text x="390" y="74" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#000000">и знаки движения</text>

  <line x1="480" y1="80" x2="480" y2="210" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="480" y="60" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#000000">Классификатор дорог</text>
  <text x="480" y="74" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#000000">OpenStreetMap</text>

  <line x1="570" y1="80" x2="570" y2="210" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="570" y="60" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#000000">Ограничения целостности</text>
  <text x="570" y="74" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#000000">и геометрии PostGIS</text>

  <!-- ВЫХОДЫ (Справа) -->
  <line x1="630" y1="240" x2="880" y2="240" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="750" y="232" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#000000">База геоданных и топологии (схемы osm, graphs)</text>

  <line x1="630" y1="285" x2="880" y2="285" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="750" y="277" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#000000">Реберный граф маневров (Line-Graph: eb_nodes, eb_edges)</text>

  <line x1="630" y1="330" x2="880" y2="330" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="750" y="322" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#000000">Бинарные структуры памяти (CSR, ALT, Attributes)</text>

  <!-- МЕХАНИЗМЫ (Снизу) -->
  <line x1="390" y1="490" x2="390" y2="360" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="390" y="510" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#000000">СУБД PostgreSQL 17</text>
  <text x="390" y="524" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#000000">+ PostGIS + pgRouting</text>

  <line x1="480" y1="490" x2="480" y2="360" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="480" y="510" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#000000">Модуль Graph Builder</text>
  <text x="480" y="524" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#000000">(C++26 / libpqxx)</text>

  <line x1="570" y1="490" x2="570" y2="360" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="570" y="510" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#000000">Утилита импорта</text>
  <text x="570" y="524" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#000000">osm2pgsql</text>
</svg>
