<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 700" width="1140" height="700">
  <defs>
    <!-- IDEF1X Маркеры: закрашенная точка (child) и перпендикулярная черта (parent) -->
    <marker id="idef1x_circle" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <circle cx="5" cy="5" r="3.5" fill="#000000"/>
    </marker>
    <marker id="idef1x_bar" viewBox="0 0 10 10" refX="0" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#000000" stroke-width="2"/>
    </marker>
  </defs>

  <rect width="1140" height="700" fill="#ffffff"/>

  <!-- ========================================================================= -->
  <!-- ТАБЛИЦА 1: OsmWays -->
  <!-- ========================================================================= -->
  <g transform="translate(30, 40)">
    <rect width="210" height="24" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
    <text x="105" y="16" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">OsmWays</text>
    <rect y="24" width="210" height="226" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
    
    <!-- PK раздел -->
    <text x="8" y="42" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold">PK</text>
    <text x="32" y="42" font-family="Helvetica, Arial, sans-serif" font-size="10" text-decoration="underline">id (bigint)</text>
    <line x1="0" y1="49" x2="210" y2="49" stroke="#000000" stroke-width="1"/>

    <!-- Атрибуты -->
    <text x="32" y="67" font-family="Helvetica, Arial, sans-serif" font-size="10">osm_id (bigint)</text>
    <text x="32" y="87" font-family="Helvetica, Arial, sans-serif" font-size="10">geom (geometry)</text>
    <text x="32" y="107" font-family="Helvetica, Arial, sans-serif" font-size="10">geom_3857 (geometry)</text>
    <text x="32" y="127" font-family="Helvetica, Arial, sans-serif" font-size="10">tags (jsonb)</text>
    <text x="32" y="147" font-family="Helvetica, Arial, sans-serif" font-size="10">highway (varchar)</text>
    <text x="32" y="167" font-family="Helvetica, Arial, sans-serif" font-size="10">maxspeed (varchar)</text>
    <text x="32" y="187" font-family="Helvetica, Arial, sans-serif" font-size="10">oneway (varchar)</text>
    <text x="32" y="207" font-family="Helvetica, Arial, sans-serif" font-size="10">lanes (int)</text>
    <text x="32" y="227" font-family="Helvetica, Arial, sans-serif" font-size="10">z_layer (int)</text>
  </g>

  <!-- ========================================================================= -->
  <!-- ТАБЛИЦА 2: GraphsNodes -->
  <!-- ========================================================================= -->
  <g transform="translate(310, 40)">
    <rect width="210" height="24" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
    <text x="105" y="16" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">GraphsNodes</text>
    <rect y="24" width="210" height="86" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
    
    <text x="8" y="42" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold">PK</text>
    <text x="32" y="42" font-family="Helvetica, Arial, sans-serif" font-size="10" text-decoration="underline">id (bigint)</text>
    <line x1="0" y1="49" x2="210" y2="49" stroke="#000000" stroke-width="1"/>

    <text x="32" y="67" font-family="Helvetica, Arial, sans-serif" font-size="10">osm_node_id (bigint)</text>
    <text x="32" y="87" font-family="Helvetica, Arial, sans-serif" font-size="10">geom (geometry)</text>
  </g>

  <!-- ========================================================================= -->
  <!-- ТАБЛИЦА 3: GraphsEdges -->
  <!-- ========================================================================= -->
  <g transform="translate(310, 200)">
    <rect width="210" height="24" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
    <text x="105" y="16" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">GraphsEdges</text>
    <rect y="24" width="210" height="246" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
    
    <text x="8" y="42" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold">PK</text>
    <text x="32" y="42" font-family="Helvetica, Arial, sans-serif" font-size="10" text-decoration="underline">id (bigint)</text>
    <line x1="0" y1="49" x2="210" y2="49" stroke="#000000" stroke-width="1"/>

    <text x="8" y="67" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold">FK</text>
    <text x="32" y="67" font-family="Helvetica, Arial, sans-serif" font-size="10">source_id (bigint)</text>
    <text x="8" y="87" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold">FK</text>
    <text x="32" y="87" font-family="Helvetica, Arial, sans-serif" font-size="10">target_id (bigint)</text>
    <text x="8" y="107" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold">FK</text>
    <text x="32" y="107" font-family="Helvetica, Arial, sans-serif" font-size="10">osm_way_id (bigint)</text>
    <text x="32" y="127" font-family="Helvetica, Arial, sans-serif" font-size="10">geometry (geometry)</text>
    <text x="32" y="147" font-family="Helvetica, Arial, sans-serif" font-size="10">length_m (float)</text>
    <text x="32" y="167" font-family="Helvetica, Arial, sans-serif" font-size="10">speed_limit_kmh (float)</text>
    <text x="32" y="187" font-family="Helvetica, Arial, sans-serif" font-size="10">duration (float)</text>
    <text x="32" y="207" font-family="Helvetica, Arial, sans-serif" font-size="10">cost (float)</text>
    <text x="32" y="227" font-family="Helvetica, Arial, sans-serif" font-size="10">reverse_cost (float)</text>
    <text x="32" y="247" font-family="Helvetica, Arial, sans-serif" font-size="10">z_layer (int)</text>
  </g>

  <!-- ========================================================================= -->
  <!-- ТАБЛИЦА 4: GraphsEbNodes -->
  <!-- ========================================================================= -->
  <g transform="translate(590, 200)">
    <rect width="220" height="24" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
    <text x="110" y="16" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">GraphsEbNodes</text>
    <rect y="24" width="220" height="226" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
    
    <text x="8" y="42" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold">PK</text>
    <text x="32" y="42" font-family="Helvetica, Arial, sans-serif" font-size="10" text-decoration="underline">id (bigint)</text>
    <line x1="0" y1="49" x2="220" y2="49" stroke="#000000" stroke-width="1"/>

    <text x="8" y="67" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold">FK</text>
    <text x="32" y="67" font-family="Helvetica, Arial, sans-serif" font-size="10">orig_edge_id (bigint)</text>
    <text x="8" y="87" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold">FK</text>
    <text x="32" y="87" font-family="Helvetica, Arial, sans-serif" font-size="10">entry_node (bigint)</text>
    <text x="8" y="107" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold">FK</text>
    <text x="32" y="107" font-family="Helvetica, Arial, sans-serif" font-size="10">exit_node (bigint)</text>
    <text x="32" y="127" font-family="Helvetica, Arial, sans-serif" font-size="10">geom (geometry)</text>
    <text x="32" y="147" font-family="Helvetica, Arial, sans-serif" font-size="10">length_m (float)</text>
    <text x="32" y="167" font-family="Helvetica, Arial, sans-serif" font-size="10">t_free (float)</text>
    <text x="32" y="187" font-family="Helvetica, Arial, sans-serif" font-size="10">speed_kmh (float)</text>
    <text x="32" y="207" font-family="Helvetica, Arial, sans-serif" font-size="10">lanes (int)</text>
    <text x="32" y="227" font-family="Helvetica, Arial, sans-serif" font-size="10">oneway (int)</text>
  </g>

  <!-- ========================================================================= -->
  <!-- ТАБЛИЦА 5: GraphsEbEdges -->
  <!-- ========================================================================= -->
  <g transform="translate(880, 200)">
    <rect width="220" height="24" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
    <text x="110" y="16" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">GraphsEbEdges</text>
    <rect y="24" width="220" height="166" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
    
    <text x="8" y="42" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold">PK</text>
    <text x="32" y="42" font-family="Helvetica, Arial, sans-serif" font-size="10" text-decoration="underline">id (bigint)</text>
    <line x1="0" y1="49" x2="220" y2="49" stroke="#000000" stroke-width="1"/>

    <text x="8" y="67" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold">FK</text>
    <text x="32" y="67" font-family="Helvetica, Arial, sans-serif" font-size="10">from_eb_node (bigint)</text>
    <text x="8" y="87" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold">FK</text>
    <text x="32" y="87" font-family="Helvetica, Arial, sans-serif" font-size="10">to_eb_node (bigint)</text>
    <text x="8" y="107" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold">FK</text>
    <text x="32" y="107" font-family="Helvetica, Arial, sans-serif" font-size="10">junction_node (bigint)</text>
    <text x="32" y="127" font-family="Helvetica, Arial, sans-serif" font-size="10">turn_angle (float)</text>
    <text x="32" y="147" font-family="Helvetica, Arial, sans-serif" font-size="10">turn_type (smallint)</text>
    <text x="32" y="167" font-family="Helvetica, Arial, sans-serif" font-size="10">maneuver_time (float)</text>
  </g>

  <!-- ========================================================================= -->
  <!-- ТАБЛИЦА 6: OsmTurnRestrictions -->
  <!-- ========================================================================= -->
  <g transform="translate(30, 340)">
    <rect width="210" height="24" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
    <text x="105" y="16" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">OsmTurnRestrictions</text>
    <rect y="24" width="210" height="106" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
    
    <text x="8" y="42" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold">PK</text>
    <text x="32" y="42" font-family="Helvetica, Arial, sans-serif" font-size="10" text-decoration="underline">id (bigint)</text>
    <line x1="0" y1="49" x2="210" y2="49" stroke="#000000" stroke-width="1"/>

    <text x="32" y="67" font-family="Helvetica, Arial, sans-serif" font-size="10">osm_id (bigint)</text>
    <text x="32" y="87" font-family="Helvetica, Arial, sans-serif" font-size="10">members (jsonb)</text>
    <text x="32" y="107" font-family="Helvetica, Arial, sans-serif" font-size="10">restriction_type (varchar)</text>
  </g>

  <!-- ========================================================================= -->
  <!-- ТАБЛИЦА 7: BuilderState -->
  <!-- ========================================================================= -->
  <g transform="translate(590, 40)">
    <rect width="220" height="24" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
    <text x="110" y="16" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">BuilderState</text>
    <rect y="24" width="220" height="66" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
    
    <text x="8" y="42" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold">PK</text>
    <text x="32" y="42" font-family="Helvetica, Arial, sans-serif" font-size="10" text-decoration="underline">stage (varchar)</text>
    <line x1="0" y1="49" x2="220" y2="49" stroke="#000000" stroke-width="1"/>

    <text x="32" y="67" font-family="Helvetica, Arial, sans-serif" font-size="10">completed_at (timestamp)</text>
  </g>

  <!-- ========================================================================= -->
  <!-- СВЯЗИ IDEF1X (Линии отношений с точками) -->
  <!-- ========================================================================= -->
  <!-- OsmWays -> GraphsEdges (osm_way_id) -->
  <path d="M 240 180 L 275 180 L 275 307 L 310 307" fill="none" stroke="#000000" stroke-width="1.2" marker-start="url(#idef1x_bar)" marker-end="url(#idef1x_circle)"/>

  <!-- GraphsNodes -> GraphsEdges (source_id, target_id) -->
  <path d="M 415 150 L 415 200" fill="none" stroke="#000000" stroke-width="1.2" marker-start="url(#idef1x_bar)" marker-end="url(#idef1x_circle)"/>

  <!-- GraphsEdges -> GraphsEbNodes (orig_edge_id) -->
  <path d="M 520 267 L 590 267" fill="none" stroke="#000000" stroke-width="1.2" marker-start="url(#idef1x_bar)" marker-end="url(#idef1x_circle)"/>

  <!-- GraphsEbNodes -> GraphsEbEdges (from_eb_node, to_eb_node) -->
  <path d="M 810 267 L 880 267" fill="none" stroke="#000000" stroke-width="1.2" marker-start="url(#idef1x_bar)" marker-end="url(#idef1x_circle)"/>

  <!-- OsmWays -> OsmTurnRestrictions -->
  <path d="M 135 290 L 135 340" fill="none" stroke="#000000" stroke-width="1.2" marker-start="url(#idef1x_bar)" marker-end="url(#idef1x_circle)"/>

</svg>
